<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172b4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Finds">
<link rel="manifest" href="manifest.webmanifest">
<title>My Finds</title>
<style>
:root{--navy:#172b4d;--blue:#355d87;--pale:#edf3f8;--ink:#17243a;--muted:#718096;--line:#dce4ed;--bg:#f5f7fa;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
header{background:var(--navy);color:white;padding:calc(18px + env(safe-area-inset-top)) 18px 20px;position:sticky;top:0;z-index:5}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:25px;font-weight:850;letter-spacing:.4px}.sub{font-size:11px;letter-spacing:1.4px;color:#c5d2e3;margin-top:5px}
main{max-width:760px;margin:auto;padding:18px 15px}.toolbar{display:flex;gap:9px;margin:4px 0 17px}.search{flex:1;min-width:0;border:1px solid var(--line);border-radius:13px;padding:13px 14px;font-size:16px;background:white}
button,.btn{border:0;border-radius:12px;background:var(--blue);color:white;font-weight:700;padding:12px 15px;font-size:14px;cursor:pointer}.btn-light{background:#e8eef5;color:var(--navy)}.addtop{white-space:nowrap}
h2{font-size:16px;margin:20px 2px 12px}.hint{color:var(--muted);font-size:13px;margin:0 2px 15px}
.category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.cat{background:var(--blue);color:white;border-radius:16px;padding:18px 14px;min-height:105px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 4px 12px #172b4d16}.cat:nth-child(even){background:var(--navy)}.emoji{font-size:25px}.cat strong{font-size:15px;letter-spacing:.5px}.cat small{color:#d9e3ef;font-size:11px}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.back{background:#e8eef5;color:var(--navy);padding:10px 12px}.section-head h2{margin:0;font-size:21px;flex:1}.count{color:var(--muted);font-size:12px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:white;border:1px solid var(--line);border-radius:15px;overflow:hidden;min-width:0}.photo{width:100%;aspect-ratio:1/1;background:#e9eef4;display:flex;align-items:center;justify-content:center;color:#8a99aa;font-size:35px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.cardbody{padding:11px}.name{font-size:14px;font-weight:750;line-height:1.25;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted);margin-top:5px}.cardactions{display:flex;gap:7px;margin-top:10px}.cardactions a,.cardactions button{flex:1;text-align:center;text-decoration:none;font-size:12px;padding:9px 5px;border-radius:9px}.openlink{background:var(--navy);color:white}.edit{background:#e8eef5;color:var(--navy)}
.empty{background:white;border:1px dashed #c4cfdb;border-radius:15px;padding:28px 18px;text-align:center;color:var(--muted);grid-column:1/-1}.empty strong{display:block;color:var(--ink);margin-bottom:6px}
.modal{position:fixed;inset:0;background:#101b2bcc;z-index:10;display:none;align-items:flex-end;justify-content:center;padding:12px}.modal.show{display:flex}.sheet{background:white;border-radius:20px 20px 15px 15px;width:min(100%,560px);max-height:92vh;overflow:auto;padding:20px}.sheet h2{font-size:20px;margin:0 0 15px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:750;color:#526174;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:white}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formbuttons{display:flex;gap:9px;margin-top:18px}.formbuttons button{flex:1}.danger{background:#fce8e8;color:#a52d2d}.preview{width:90px;height:90px;border-radius:12px;object-fit:cover;background:#edf1f5;display:none;margin-top:8px}
.footer-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.footer-tools button{font-size:12px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#172b4d;color:white;padding:11px 16px;border-radius:12px;z-index:20;display:none;max-width:90%;font-size:13px}
@media(min-width:620px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.category-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.modal{align-items:center}}
</style>
</head>
<body>
<header><div class="topline"><div><div class="brand">MY FINDS</div><div class="sub">YOUR PERSONAL PRODUCT CATALOGUE</div></div><button class="addtop" id="addBtn">＋ Add item</button></div></header>
<main>
<div class="toolbar"><input class="search" id="search" type="search" placeholder="Search your saved finds…" autocomplete="off"><button class="btn btn-light" id="clearSearch" aria-label="Clear search">✕</button></div>
<div id="homeView">
<p class="hint">Choose a section to browse your saved products.</p>
<div class="category-grid" id="categoryGrid"></div>
</div>
<div id="categoryView" hidden>
<div class="section-head"><button class="back" id="backBtn">← Home</button><h2 id="categoryTitle"></h2><span class="count" id="count"></span></div>
<div class="cards" id="productGrid"></div>
</div>
<div class="footer-tools">
<button class="btn-light" id="exportBtn">Export backup</button>
<button class="btn-light" id="importBtn">Import backup</button>
<button class="btn-light" id="helpBtn">How it works</button>
<input id="importFile" type="file" accept="application/json" hidden>
</div>
</main>
<div class="modal" id="modal">
<div class="sheet">
<h2 id="formTitle">Add a find</h2>
<form id="itemForm">
<input type="hidden" id="itemId">
<div class="field"><label for="itemName">ITEM NAME *</label><input id="itemName" maxlength="90" required placeholder="e.g. Grey zip hoodie"></div>
<div class="formrow">
<div class="field"><label for="itemCategory">CATEGORY *</label><select id="itemCategory" required></select></div>
<div class="field"><label for="itemSource">SOURCE</label><select id="itemSource"><option>Yupoo</option><option>Sugargoo</option><option>1688</option><option>Weidian</option><option>Other</option></select></div>
</div>
<div class="field"><label for="itemLink">PRODUCT LINK *</label><input id="itemLink" type="url" required placeholder="https://…"></div>
<div class="formrow">
<div class="field"><label for="itemPrice">PRICE (OPTIONAL)</label><input id="itemPrice" inputmode="decimal" placeholder="e.g. 18.50"></div>
<div class="field"><label for="itemPhoto">PHOTO (OPTIONAL)</label><input id="itemPhoto" type="file" accept="image/*"></div>
</div>
<img id="photoPreview" class="preview" alt="Selected product preview">
<div class="formbuttons"><button type="button" class="btn-light" id="cancelBtn">Cancel</button><button type="submit" id="saveBtn">Save item</button></div>
<button type="button" class="danger" id="deleteBtn" style="width:100%;margin-top:10px;display:none">Delete item</button>
</form>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
const CATS=[["Hats","🧢"],["Accessories","⌚"],["Shoes","👟"],["Jumpers","🧥"],["Shorts","🩳"],["Shirts","👕"]];
const KEY="my-finds-items-v1";let items=[];let currentCategory=null;let draftPhoto="";
const $=id=>document.getElementById(id);
try{items=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){items=[]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(items));return true}catch(e){toast("Storage is full. Export a backup and use smaller photos.");return false}}
function toast(msg){$("toast").textContent=msg;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2600)}
function safeUrl(s){try{const u=new URL(s);return ["http:","https:"].includes(u.protocol)?u.href:null}catch(e){return null}}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderHome(){
$("homeView").hidden=false;$("categoryView").hidden=true;
$("categoryGrid").innerHTML=CATS.map(([name,emoji])=>{const n=items.filter(x=>x.category===name).length;return `<button class="cat" data-cat="${name}"><span class="emoji">${emoji}</span><strong>${name.toUpperCase()}　→</strong><small>${n} saved ${n===1?"item":"items"}</small></button>`}).join("");
document.querySelectorAll("[data-cat]").forEach(b=>b.addEventListener("click",()=>openCategory(b.dataset.cat)));
}
function openCategory(cat){currentCategory=cat;$("homeView").hidden=true;$("categoryView").hidden=false;$("categoryTitle").textContent=cat;renderProducts()}
function renderProducts(){
const q=$("search").value.trim().toLowerCase();
let list=items.filter(x=>(!currentCategory||x.category===currentCategory)&&(!q||[x.name,x.source,x.category,x.link].join(" ").toLowerCase().includes(q)));
$("count").textContent=`${list.length} ${list.length===1?"item":"items"}`;
$("productGrid").innerHTML=list.length?list.map(x=>`<article class="card"><div class="photo">${x.photo?`<img src="${x.photo}" alt="${escapeHtml(x.name)}">`:"＋"}</div><div class="cardbody"><div class="name">${escapeHtml(x.name)}</div><div class="meta">${escapeHtml(x.source)}${x.price?` · £${escapeHtml(x.price)}`:""}</div><div class="cardactions"><a class="openlink" href="${escapeHtml(x.link)}" target="_blank" rel="noopener">Open link ↗</a><button class="edit" data-edit="${x.id}">Edit</button></div></div></article>`).join(""):`<div class="empty"><strong>No finds here yet</strong>Add your first ${escapeHtml(currentCategory||"product")} using the button above.</div>`;
document.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>editItem(b.dataset.edit)));
}
function openForm(item=null){
$("itemForm").reset();draftPhoto=item?.photo||"";$("itemId").value=item?.id||"";$("formTitle").textContent=item?"Edit find":"Add a find";$("itemName").value=item?.name||"";$("itemCategory").value=item?.category||currentCategory||"Shoes";$("itemSource").value=item?.source||"Yupoo";$("itemLink").value=item?.link||"";$("itemPrice").value=item?.price||"";
$("photoPreview").style.display=draftPhoto?"block":"none";$("photoPreview").src=draftPhoto||"";$("deleteBtn").style.display=item?"block":"none";$("modal").classList.add("show");
}
function editItem(id){const item=items.find(x=>x.id===id);if(item)openForm(item)}
function closeForm(){$("modal").classList.remove("show")}
function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,850/Math.max(img.width,img.height));const canvas=document.createElement("canvas");canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL("image/jpeg",.72))};img.onerror=reject;img.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}
$("itemPhoto").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{draftPhoto=await compressImage(f);$("photoPreview").src=draftPhoto;$("photoPreview").style.display="block"}catch(err){toast("Couldn't load that picture")}})
$("itemForm").addEventListener("submit",e=>{e.preventDefault();const link=safeUrl($("itemLink").value.trim());if(!link){toast("Please enter a valid http or https product link.");return}const id=$("itemId").value||String(Date.now());const item={id,name:$("itemName").value.trim(),category:$("itemCategory").value,source:$("itemSource").value,link,price:$("itemPrice").value.trim(),photo:draftPhoto};const index=items.findIndex(x=>x.id===id);if(index>=0)items[index]=item;else items.unshift(item);if(persist()){closeForm();renderHome();if(currentCategory)openCategory(currentCategory);toast("Find saved")}})
$("deleteBtn").addEventListener("click",()=>{const id=$("itemId").value;if(!confirm("Delete this saved find?"))return;items=items.filter(x=>x.id!==id);persist();closeForm();renderHome();if(currentCategory)openCategory(currentCategory);toast("Find deleted")});
$("addBtn").addEventListener("click",()=>openForm());$("cancelBtn").addEventListener("click",closeForm);$("backBtn").addEventListener("click",()=>{currentCategory=null;renderHome()});
$("search").addEventListener("input",()=>{if(currentCategory)renderProducts();else{const q=$("search").value.trim().toLowerCase();$("categoryGrid").querySelectorAll("[data-cat]").forEach(b=>{const cat=b.dataset.cat;b.style.display=(!q||cat.toLowerCase().includes(q)||items.some(x=>x.category===cat&&x.name.toLowerCase().includes(q)))?"flex":"none"})}});
$("clearSearch").addEventListener("click",()=>{$("search").value="";if(currentCategory)renderProducts();else renderHome()});
$("exportBtn").addEventListener("click",()=>{const blob=new Blob([JSON.stringify(items)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="my-finds-backup.json";a.click();URL.revokeObjectURL(a.href);toast("Backup exported")});
$("importBtn").addEventListener("click",()=>$("importFile").click());
$("importFile").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data)||!data.every(x=>x.name&&x.link&&x.category))throw Error();if(confirm(`Import ${data.length} saved finds? This replaces the current list.`)){items=data;persist();renderHome();toast("Backup imported")}}catch(err){toast("That backup file doesn't look valid")}e.target.value=""});
$("helpBtn").addEventListener("click",()=>alert("Tap a category, then Add item. Save the name and product link; photo, price and source are optional. Your finds are saved in this browser on this iPhone. Use Export backup occasionally so you can restore them if needed."));
$("itemCategory").innerHTML=CATS.map(([n])=>`<option>${n}</option>`).join("");
renderHome();
if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body></html>
